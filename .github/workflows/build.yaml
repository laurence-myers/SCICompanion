name: Build SCI Companion

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Kawa]
        platform: [Win32]

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # The image ships the v143 toolset (MSVC 14.44) and the Windows 11 SDK.
    # MFC is installed per toolset version, and the image only has MFC for
    # its latest toolset. Add MFC and ATL for 14.44. This is a small install.
    - name: Install MFC and ATL for the 14.44 toolset
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products '*' -property installationPath
        if (-not $installPath) { throw "Visual Studio not found." }

        # setup.exe is the installer engine, so -Wait waits for the real work.
        # Do not pass --wait. The installed engine rejects it (exit code 87).
        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        $vsArgs = "modify --installPath `"$installPath`"" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC" +
          " --quiet --norestart --force --nocache"
        $proc = Start-Process -FilePath $setup -ArgumentList $vsArgs -Wait -PassThru -NoNewWindow
        # 0 = done. 3010 = done, reboot pending.
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "Install failed ($($proc.ExitCode))." }

        # Stop here if MFC did not land for 14.44.
        $mfc = Get-ChildItem -ErrorAction SilentlyContinue `
          -Path "$installPath\VC\Tools\MSVC\14.44.*\atlmfc\lib\x86\mfc140.lib"
        if (-not $mfc) { throw "MFC for the 14.44 toolset was not found after the install." }

    # The toolset and SDK come from the project files.
    - name: Build
      run: |
        msbuild SCICompanion.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
        mkdir artifacts
        copy ${{ matrix.configuration }}\*.exe artifacts
        # The build writes the manifest next to the exe. Ship it too.
        Copy-Item ${{ matrix.configuration }}\*.manifest artifacts -ErrorAction SilentlyContinue
        Get-ChildItem ${{ matrix.configuration }} -Directory |
        Foreach-Object {
            Copy-Item -Path $_.FullName -Destination "artifacts" -recurse
        }

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SCICompanion-${{ matrix.configuration }}-${{ matrix.platform }}-${{ github.sha }}
        path: artifacts
