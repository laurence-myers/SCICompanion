name: Build SCI Companion

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32]

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # The image ships the v143 toolset (MSVC 14.44) and the Windows 11 SDK.
    # MFC is installed per toolset version, and the image only has MFC for
    # its latest toolset. Add MFC and ATL for 14.44. This is a small install.
    - name: Install MFC and ATL for the 14.44 toolset
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products '*' -property installationPath
        if (-not $installPath) { throw "Visual Studio not found." }

        # setup.exe is the installer engine, so -Wait waits for the real work.
        # Do not pass --wait. The installed engine rejects it (exit code 87).
        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        # The C++ unit test framework (VC\Auxiliary\VS\UnitTest) ships with the
        # Desktop C++ workload (VC.CoreIde), already on the image, so it needs
        # no --add here.
        $vsArgs = "modify --installPath `"$installPath`"" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC" +
          " --quiet --norestart --force --nocache"
        $proc = Start-Process -FilePath $setup -ArgumentList $vsArgs -Wait -PassThru -NoNewWindow
        # 0 = done. 3010 = done, reboot pending.
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "Install failed ($($proc.ExitCode))." }

        # Stop here if MFC did not land for 14.44.
        $mfc = Get-ChildItem -ErrorAction SilentlyContinue `
          -Path "$installPath\VC\Tools\MSVC\14.44.*\atlmfc\lib\x86\mfc140.lib"
        if (-not $mfc) { throw "MFC for the 14.44 toolset was not found after the install." }

    # The toolset and SDK come from the project files.
    - name: Build
      run: |
        msbuild SCICompanion.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
        mkdir artifacts
        copy ${{ matrix.configuration }}\*.exe artifacts
        # The build writes the manifest next to the exe. Ship it too.
        Copy-Item ${{ matrix.configuration }}\*.manifest artifacts -ErrorAction SilentlyContinue
        # Skip TestFiles: the test post-build drops fixtures and pic data there.
        Get-ChildItem ${{ matrix.configuration }} -Directory |
        Where-Object { $_.Name -ne "TestFiles" } |
        Foreach-Object {
            Copy-Item -Path $_.FullName -Destination "artifacts" -recurse
        }

    # Run the whole unit-test suite. RunTests.ps1 with no -Filter runs every
    # test, so nothing is silently skipped in CI.
    - name: Test
      shell: pwsh
      timeout-minutes: 15
      run: .\UnitTests\RunTests.ps1 -Configuration ${{ matrix.configuration }}

    # Integration tests (threads, child processes, windows) run in their own
    # step, separate from the fast unit leg above and reusing the same build.
    # They are deadline-wrapped; -BlameHang adds a vstest hang dump and the step
    # timeout is the hard backstop if a test wedges the host.
    - name: Test (integration)
      shell: pwsh
      timeout-minutes: 10
      run: .\UnitTests\RunTests.ps1 -Configuration ${{ matrix.configuration }} -Integration -BlameHang

    # Show a pass/fail table in the run summary, so a failure is visible without
    # downloading the .trx artifact. Runs even when a test step failed. (B8 of #76.)
    - name: Test summary
      if: always()
      shell: pwsh
      run: |
        $rows = @()
        Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
          [xml]$trx = Get-Content $_.FullName
          $c = $trx.TestRun.ResultSummary.Counters
          $rows += "| $($_.Name) | $($c.total) | $($c.passed) | $($c.failed) |"
        }
        $summary = if ($rows.Count -gt 0) {
          @("## Test results", "", "| File | Total | Passed | Failed |", "| --- | ---: | ---: | ---: |") + $rows
        } else {
          @("## Test results", "", "No .trx files were produced.")
        }
        $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TestResults-${{ matrix.configuration }}-${{ matrix.platform }}-${{ github.sha }}
        path: TestResults

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SCICompanion-${{ matrix.configuration }}-${{ matrix.platform }}-${{ github.sha }}
        path: artifacts

  # AddressSanitizer leg. Builds the unit-test tree with /fsanitize=address and
  # runs the unit suite, so a memory-safety regression (out-of-bounds read/write,
  # use-after-free) faults the build instead of passing unnoticed in a plain
  # Release build. Runs in parallel with the fast `build` job above.
  asan:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Same MFC/ATL install as the build job (a separate job gets a clean runner).
    - name: Install MFC and ATL for the 14.44 toolset
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products '*' -property installationPath
        if (-not $installPath) { throw "Visual Studio not found." }

        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        $vsArgs = "modify --installPath `"$installPath`"" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC" +
          " --quiet --norestart --force --nocache"
        $proc = Start-Process -FilePath $setup -ArgumentList $vsArgs -Wait -PassThru -NoNewWindow
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "Install failed ($($proc.ExitCode))." }

        $mfc = Get-ChildItem -ErrorAction SilentlyContinue `
          -Path "$installPath\VC\Tools\MSVC\14.44.*\atlmfc\lib\x86\mfc140.lib"
        if (-not $mfc) { throw "MFC for the 14.44 toolset was not found after the install." }

    # Build only the UnitTests project and its dependencies with ASan. /MT links
    # the ASan runtime statically, so no extra DLL is needed to run the tests.
    #
    # _DISABLE_STRING_ANNOTATION / _DISABLE_VECTOR_ANNOTATION: the tree links
    # prebuilt libraries (MFC), so the std::string / std::vector container-overflow
    # annotations cannot be guaranteed identical across every linked object, which
    # otherwise fails linking with LNK2038. Disabling them drops only the container-
    # overflow check; core ASan (heap and stack out-of-bounds, use-after-free) still
    # applies, which is what the memory-safety tests exercise.
    - name: Build UnitTests with AddressSanitizer
      shell: pwsh
      env:
        CL: /D_DISABLE_STRING_ANNOTATION /D_DISABLE_VECTOR_ANNOTATION
      run: |
        msbuild SCICompanion.sln -m -t:UnitTests -p:Configuration=Release -p:Platform=Win32 -p:EnableASAN=true

    # Deploy the game fixtures the compile / class-browser tests need. This job
    # builds only -t:UnitTests, which does NOT build the SCICompanion app project
    # -- and the app's post-build is what normally drops the template games,
    # compile includes, decompiler and object templates next to the test binaries.
    # Without them SetUpGame cannot copy a template game, so those tests fail (and,
    # before the teardown guard, crashed the host). The plain `build` job never hit
    # this because it builds the whole solution. Mirror just the folders these
    # tests read, matching the app's own post-build robocopy targets. (#95)
    - name: Deploy test fixtures for the ASan run
      shell: pwsh
      run: |
        $pairs = @(
          @{ src = "SCICompanion\Files\TemplateGame";   dst = "Release\TemplateGame" },
          @{ src = "SCICompanion\Files\CompileInclude"; dst = "Release\include" },
          @{ src = "SCICompanion\Files\Decompiler";     dst = "Release\Decompiler" },
          @{ src = "SCICompanion\Files\Objects";        dst = "Release\Objects" },
          @{ src = "SCICompanion\Tools";                dst = "Release\Tools" }
        )
        foreach ($p in $pairs) {
          # robocopy exits 0-7 on success, 8+ on failure.
          robocopy $p.src $p.dst /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE) for $($p.src)." }
        }
        Write-Host "Deployed test fixtures next to the ASan test binaries."

    # Run the unit suite under ASan. The integration tests (threads, child
    # processes) are excluded here; this leg targets the memory-safety unit tests.
    #
    # This step is a HARD GATE. The unit suite is ASan-clean, and this ASan build
    # is non-recoverable (/fsanitize=address without -fsanitize-recover), so the
    # first memory-safety finding (heap/stack out-of-bounds, use-after-free)
    # terminates the instrumented test host; vstest then aborts the run and
    # RunTests.ps1 exits non-zero, failing the build. (Verified with a deliberate
    # overflow tripwire: it crashed the host and failed the run.) The ASan *build*
    # step above gates the compile and link; this step gates the run. (#95)
    - name: Test (unit, under ASan)
      shell: pwsh
      timeout-minutes: 25
      run: |
        # An ASan-instrumented DLL needs the dynamic ASan runtime
        # (clang_rt.asan_dynamic-i386.dll) at load time -- a DLL target uses the
        # dynamic runtime even with /MT. It MUST be the runtime from the SAME
        # toolset that compiled the code; an older one (the image ships several
        # MSVC versions) does not export the symbols the instrumented DLL imports,
        # and the test assembly then fails to load. Read the exact v143 toolset
        # version the build used, and take that version's runtime.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vc = & $vswhere -latest -products '*' -property installationPath
        $verFile = "$vc\VC\Auxiliary\Build\Microsoft.VCToolsVersion.v143.default.txt"
        if (-not (Test-Path $verFile)) { $verFile = "$vc\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" }
        $toolsVersion = (Get-Content $verFile -Raw).Trim()
        $asan = Get-ChildItem "$vc\VC\Tools\MSVC\$toolsVersion\bin\Host*\x86\clang_rt.asan_dynamic-i386.dll" | Select-Object -First 1
        if (-not $asan) { throw "ASan runtime DLL not found for toolset $toolsVersion." }
        Write-Host "ASan runtime: $($asan.FullName)"
        # Put it where the test host will find it: next to UnitTests.dll (a test
        # DLL's own directory is searched for its dependencies), on PATH, and (belt
        # and suspenders) in System32, which is always searched.
        Copy-Item $asan.FullName "Release" -Force
        $env:PATH = "$($asan.Directory.FullName);$env:PATH"
        try { Copy-Item $asan.FullName "$env:SystemRoot\System32" -Force -ErrorAction Stop }
        catch { Write-Host "Could not copy ASan runtime to System32 (continuing): $_" }
        .\UnitTests\RunTests.ps1 -Configuration Release

    - name: Upload ASan Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ASanTestResults-${{ github.sha }}
        path: TestResults

  # MSVC Code Analysis (/analyze) leg. Informational for now: the first-party
  # library has never been analysed, so it reports a backlog rather than gating.
  # (The ASan leg was informational in the same way until #95 made it a hard
  # gate.) Findings are in the uploaded log artifact. Runs in
  # parallel with build and asan. Follow-on #80 steps (raise to /W4 and promote a
  # few warnings to errors after a clean-up pass; clang-tidy; [[nodiscard]] on
  # context.code().inst via #59; SARIF to code scanning) are tracked separately.
  static-analysis:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC and ATL for the 14.44 toolset
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products '*' -property installationPath
        if (-not $installPath) { throw "Visual Studio not found." }

        $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        $vsArgs = "modify --installPath `"$installPath`"" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL" +
          " --add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC" +
          " --quiet --norestart --force --nocache"
        $proc = Start-Process -FilePath $setup -ArgumentList $vsArgs -Wait -PassThru -NoNewWindow
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "Install failed ($($proc.ExitCode))." }

        $mfc = Get-ChildItem -ErrorAction SilentlyContinue `
          -Path "$installPath\VC\Tools\MSVC\14.44.*\atlmfc\lib\x86\mfc140.lib"
        if (-not $mfc) { throw "MFC for the 14.44 toolset was not found after the install." }

    # Build the first-party library with Code Analysis on. continue-on-error: the
    # analysis reports a backlog today, so it must not fail the build. A clean-up
    # pass and a promotion to a hard gate are follow-on work (#80).
    - name: Build with MSVC Code Analysis
      shell: pwsh
      continue-on-error: true
      run: |
        msbuild SCICompanion.sln -m -t:SCICompanionLib -p:Configuration=Release -p:Platform=Win32 -p:RunCodeAnalysis=true -v:normal |
          Tee-Object -FilePath analyze.log
        $warns = @(Select-String -Path analyze.log -Pattern 'warning C(6|26|28)\d\d\d').Count
        Write-Host "MSVC Code Analysis warnings: $warns"

    - name: Upload Code Analysis log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CodeAnalysis-${{ github.sha }}
        path: analyze.log
